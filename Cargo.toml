[workspace]
resolver = "2"
members = [
    "crates/maniac-core",
    "crates/maniac-linux",
    "crates/maniac-docker",
    "crates/maniac-ecs",
    "crates/maniac-protocol",
    "crates/maniac-agent",
    "crates/maniac-server",
    "crates/maniac-topology",
    "crates/maniac-otel",
    "crates/maniac-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Maniac contributors"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
